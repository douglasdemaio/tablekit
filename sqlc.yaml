version: "2"
sql:
  - engine: postgresql
    schema: "migrations"
    queries: "queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/db/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        rename:
          staff_role: StaffRoleEnum
          order_status: OrderStatusEnum
          fulfilment_mode: FulfilmentModeEnum
          payment_status: PaymentStatusEnum
          handoff_kind: HandoffKindEnum
          media_kind: MediaKindEnum
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              type: "UUID"
              import: "github.com/google/uuid"
              pointer: true
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
